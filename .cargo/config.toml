# iOS links the static library, with Xcode supplying the Swift half of Tauri:
# plugin registration, the webview callbacks, swift-rs's object retain/release.
#
# The same lib target also produces a cdylib, because Android loads one as
# libdarkroom_lib.so - and unlike a staticlib or an rlib, a cdylib has to be
# linked there and then. On iOS there is nothing to link it against: that Swift
# lives in the Xcode project and is compiled later, so the build stops with
#
#   Undefined symbols for architecture arm64:
#     "_register_plugin", "_on_webview_created", "_retain_object", ...
#
# Nothing on iOS ever loads that cdylib. Leaving its undefined symbols to be
# resolved at load time lets it link, and the staticlib Xcode actually uses gets
# built. Cargo cannot vary crate types per target, which is why this is a linker
# flag rather than a line in Cargo.toml.
#
# It only applies to the three iOS triples: desktop and Android are untouched.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
