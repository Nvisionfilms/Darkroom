[package]
name = "darkroom"
version = "0.2.13"
description = "Darkroom - RAW photo editor"
authors = ["Nvisionfilms"]
edition = "2021"

[lib]
name = "darkroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.6"
rayon = "1.10"
half = "2"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
notify = "8"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
