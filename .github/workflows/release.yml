# Builds signed release bundles for macOS (Apple silicon + Intel) and Windows.
#
# Normal releases still run when a version tag is pushed (v0.2.4, v1.0.0, ...).
# A release/vX.Y.Z branch can also trigger the same pipeline. That branch path is
# useful when cutting a release through the GitHub API instead of a local git
# checkout. The Tauri action creates/publishes the matching GitHub Release and
# latest.json, which installed apps poll for updates.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
# Optional, for a notarised Mac build instead of ad-hoc signing:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Windows note: updater signing is not Windows Authenticode code signing.
# A Windows code-signing certificate / signing service is still required to
# remove SmartScreen publisher warnings for browser-downloaded installers.

name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.4. Leave blank to use package.json."
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            # Publish one obvious Windows installer instead of both WiX MSI
            # and NSIS. NSIS current-user mode avoids requiring elevation.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            tag="v${{ inputs.version }}"
          else
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # To notarise the Mac build with an Apple Developer certificate, add
          # these lines back and set the matching repository secrets. Passing
          # them while the secrets are unset makes the bundler try to import an
          # empty certificate and fail.
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ steps.release_meta.outputs.tag }}
          releaseName: Darkroom ${{ steps.release_meta.outputs.tag }}
          releaseBody: Download the installer for your platform. Windows users should use the x64 setup.exe. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Smoke test Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Darkroom NSIS installer was not produced."
          }

          Write-Host "Testing installer: $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Darkroom installer returned exit code $($process.ExitCode)."
          }
