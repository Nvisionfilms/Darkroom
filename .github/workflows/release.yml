# Builds signed release bundles for macOS (Apple silicon + Intel) and Windows
# whenever a version tag is pushed or a versioned release branch is created.
# Publishes them as a GitHub Release together with latest.json, which installed
# apps poll for updates.
#
# API-driven release convention:
#   1. bump the version on main
#   2. create release/vX.Y.Z from main exactly once
#   3. branch creation starts the release; later commits to that release branch
#      are intentionally ignored so duplicate asset uploads cannot race
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
# Optional, for a notarised Mac build instead of ad-hoc signing:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Windows note: updater signing is not Windows Authenticode code signing.
# A Windows code-signing certificate / signing service is still required to
# remove SmartScreen publisher warnings for browser-downloaded installers.

name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:

jobs:
  build:
    # For release/v* branches, only the branch-creation push should publish.
    # Subsequent commits on that branch would otherwise start another matrix
    # and race to overwrite the same GitHub Release assets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (startsWith(github.ref, 'refs/heads/release/v') && github.event.before == '0000000000000000000000000000000000000000')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            # Publish one obvious Windows installer instead of both WiX MSI
            # and NSIS. NSIS current-user mode avoids requiring elevation.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          else
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Darkroom ${{ steps.release.outputs.tag }}
          releaseBody: Download the installer for your platform. Windows users should use the x64 setup.exe. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Smoke test Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Darkroom NSIS installer was not produced."
          }

          Write-Host "Testing installer: $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Darkroom installer returned exit code $($process.ExitCode)."
          }
