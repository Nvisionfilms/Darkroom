# Builds signed release bundles for macOS (Apple silicon + Intel) and Windows
# whenever a version tag is pushed or a versioned release branch is created.
#
# Source and GitHub Release assets remain private in Nvisionfilms/Darkroom.
# Installed apps never receive the GitHub URL directly: they poll the custom
# update proxy at updates.nvisionfilms.com, which authenticates to GitHub on
# the server side and streams only the updater JSON / requested binaries.
#
# API-driven release convention:
#   1. bump the version on main
#   2. create release/vX.Y.Z from main exactly once
#   3. branch creation starts the release; later commits to that release branch
#      are intentionally ignored so duplicate asset uploads cannot race
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
#
# Optional, to publish an Android APK as well (the android job is skipped
# without them). See docs/mobile.md for how to make the keystore:
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks, kept for the life of the app
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_ALIAS           the key's alias inside the store
#   ANDROID_KEY_PASSWORD        the key's own password
#
# Optional, for a notarised Mac build instead of ad-hoc signing:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Windows note: updater signing is not Windows Authenticode code signing.
# A Windows code-signing certificate / signing service is still required to
# remove SmartScreen publisher warnings for browser-downloaded installers.

name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:

jobs:
  build:
    # For release/v* branches, only the branch-creation push should publish.
    # Subsequent commits on that branch would otherwise start another matrix
    # and race to overwrite the same GitHub Release assets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (startsWith(github.ref, 'refs/heads/release/v') && github.event.before == '0000000000000000000000000000000000000000')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            # Publish one obvious Windows installer. perMachine mode is set in
            # tauri.conf.json so legacy Program Files installs can be upgraded.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          else
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Darkroom ${{ steps.release.outputs.tag }}
          releaseBody: Download the installer for your platform. Windows users should use the x64 setup.exe. Installed copies update through the Darkroom update channel.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Smoke test Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Darkroom NSIS installer was not produced."
          }

          Write-Host "Testing installer: $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Darkroom installer returned exit code $($process.ExitCode)."
          }

  # Android has no in-app updater - only Android's own package installer may
  # install an APK - so the phone is published a small manifest it can poll and
  # an APK its browser can download. Skipped when no keystore secret is set,
  # because an unsigned or debug-signed APK cannot update an installed copy.
  android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (startsWith(github.ref, 'refs/heads/release/v') && github.event.before == '0000000000000000000000000000000000000000')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a signing key configured?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, skipping the Android build."
          fi

      - name: Resolve release tag
        if: steps.key.outputs.have == 'yes'
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          else
            tag="v$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.have == 'yes'
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'yes'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.key.outputs.have == 'yes'

      - name: Install the NDK
        if: steps.key.outputs.have == 'yes'
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.have == 'yes'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        if: steps.key.outputs.have == 'yes'
        with:
          workspaces: ./src-tauri -> target

      - run: bun install --frozen-lockfile
        if: steps.key.outputs.have == 'yes'

      - name: Write the keystore
        if: steps.key.outputs.have == 'yes'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build the APK
        if: steps.key.outputs.have == 'yes'
        run: bun tauri android build --apk --target aarch64

      - name: Collect the APK and write the Android manifest
        if: steps.key.outputs.have == 'yes'
        id: apk
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          src=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$src" ]; then echo "no signed APK was produced" >&2; exit 1; fi
          mkdir -p dist-android
          out="dist-android/Darkroom_${VERSION}_aarch64.apk"
          cp "$src" "$out"
          # the phone polls this through the same proxy the desktop updater uses
          cat > dist-android/android.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Darkroom ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "url": "https://updates.nvisionfilms.com/darkroom/assets/Darkroom_${VERSION}_aarch64.apk"
          }
          JSON
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          ls -lh dist-android

      - name: Attach them to the release
        if: steps.key.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # the desktop matrix creates the release; wait for it rather than racing
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "waiting for release $TAG ($i)"; sleep 20
          done
          gh release upload "$TAG" dist-android/*.apk dist-android/android.json --clobber
