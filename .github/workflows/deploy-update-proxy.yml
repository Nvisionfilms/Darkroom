name: deploy-update-proxy

on:
  push:
    branches:
      - main
    paths:
      - "infra/update-proxy/**"
      - ".github/workflows/deploy-update-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DARKROOM_UPDATE_GITHUB_TOKEN: ${{ secrets.DARKROOM_UPDATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate update proxy secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$DARKROOM_UPDATE_GITHUB_TOKEN" || { echo "Missing DARKROOM_UPDATE_GITHUB_TOKEN"; exit 1; }

      - name: Deploy Worker
        working-directory: infra/update-proxy
        run: npx --yes wrangler@4 deploy

      - name: Set private GitHub read token on Worker
        working-directory: infra/update-proxy
        shell: bash
        run: printf '%s' "$DARKROOM_UPDATE_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
