<!doctype html><html><head><meta charset="utf-8"><title>NFrame holographic controls</title>
<!-- Style reference for src/Holo.css. Run `bun run dev` and open /design/holo-test.html -->
<link rel="stylesheet" href="/src/Holo.css">
<style>body{background:#19191e;color:#eee;font:13px sans-serif;padding:24px;display:grid;gap:18px;width:300px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#16161b;padding:10px;border-radius:7px}
button{background:#22222a;color:#eee;border:1px solid #303039;border-radius:8px;padding:8px 14px}
.bar{background:#16161a;padding:14px;border-radius:8px}</style></head><body>
<div class="bar"><img class="brand-logo" src="/src/assets/nframe-logo.png"></div>
<div class="row"><span>Enable trails</span><input type="checkbox" checked></div>
<div class="row"><span>Enable starburst</span><input type="checkbox"></div>
<div class="row"><span>Show mask</span><input type="checkbox" checked></div>
<div style="display:flex;gap:10px"><button class="primary export-button">Export</button><button class="tab active">Histogram</button><button>Plain</button><button class="active">Active</button></div>
<img class="viewer-empty-logo" src="/src/assets/nframe-logo.png">
</body></html>
